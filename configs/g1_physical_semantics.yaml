schema_version: "1.0.0"
robot:
  name: Unitree_G1
  # Path to the official MuJoCo Menagerie G1 scene file.
  # Set the environment variable before running, e.g.:
  #   export G1_MJCF=/path/to/mujoco_menagerie/unitree_g1/scene.xml
  xml: "${G1_MJCF}"
  keyframe: stand
  dt: 0.03333333333333333
  arm_joint_order:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
  arm_body_order:
    - left_shoulder_pitch_link
    - left_shoulder_roll_link
    - left_shoulder_yaw_link
    - left_elbow_link
    - left_wrist_roll_link
    - left_wrist_pitch_link
    - left_wrist_yaw_link
    - right_shoulder_pitch_link
    - right_shoulder_roll_link
    - right_shoulder_yaw_link
    - right_elbow_link
    - right_wrist_roll_link
    - right_wrist_pitch_link
    - right_wrist_yaw_link
data:
  # Root directory that contains G1_Dex3 / G1_DiverseManip / G1_WBT
  # (LeRobot-format folders with meta/ and data/ sub-directories).
  #   export G1_ACTION_ROOT=/path/to/G1_Action
  root: "${G1_ACTION_ROOT}"
  datasets: [G1_Dex3, G1_DiverseManip, G1_WBT]
  output: "data/physical_semantics"
  max_frames_per_dataset: null
  max_contacts: 8
  future_horizon: 15
  read_videos: false
augmentation:
  base_seed: 20261013
  state_noise_std_rad: 0.003
  action_noise_std_rad: 0.001
  delay_steps: [0, 3]
  mass_scale: [0.98, 1.02]
  friction_scale: [0.85, 1.15]
  external_force_probability: 0.35
  external_force_newton: [0.0, 30.0]
  external_force_duration_frames: [2, 8]
  terrain_slope_rad: [0.0, 0.0]
  sensor_occlusion_probability: 0.0
training:
  folds: 5
  seed: 20261014
  epochs: 4
  batch_size: 4096
  learning_rate: 0.001
  weight_decay: 0.00001
  hidden_dim: 256
  max_train_samples_per_fold: null
  amp: true
  amp_dtype: bfloat16
